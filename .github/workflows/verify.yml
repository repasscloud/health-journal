name: Foundation verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool/native_encryption_probe.dart
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tool/browser
      - run: npx --prefix tool/browser playwright install --with-deps chrome
      - run: npx --prefix tool/browser playwright test --config tool/browser/playwright.config.cjs
